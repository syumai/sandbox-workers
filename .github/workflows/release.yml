name: release

on:
  push:
    branches: [main]
  # Publish an existing tag whose publish step failed (e.g. tagpr already
  # created the tag and GitHub Release, but npm publish errored partway
  # through). Re-running the push-triggered job can't do this: tagpr only
  # outputs a tag in the run that creates it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      upload-tarballs: true
      # Build the dispatched tag's tree rather than main's HEAD; empty on a
      # push event, which ci.yml's checkout treats as its default behaviour.
      ref: ${{ inputs.tag }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run tagpr
        id: tagpr
        if: github.event_name == 'push'
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # On push, the tag (if any) comes from tagpr. On workflow_dispatch, it's
      # the given tag input, verified to actually exist.
      - name: Resolve tag
        id: resolve
        env:
          DISPATCH_TAG: "${{ inputs.tag }}"
          TAGPR_TAG: "${{ steps.tagpr.outputs.tag }}"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! git rev-parse "refs/tags/$DISPATCH_TAG" >/dev/null 2>&1; then
              echo "::error::tag $DISPATCH_TAG does not exist"
              exit 1
            fi
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAGPR_TAG" >> "$GITHUB_OUTPUT"
          fi

      # Everything below runs only when there is a tag to publish: the release
      # PR was just merged and tagpr created a tag, or this run was dispatched
      # to (re)publish an existing one. Publishing lives in this job because
      # tags pushed with GITHUB_TOKEN do not trigger other workflows.
      - name: Set up Node.js
        if: steps.resolve.outputs.tag != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          # No registry-url: setup-node would write a placeholder auth token to
          # .npmrc, which gets in the way of OIDC trusted publishing.

      - name: Ensure npm supports Trusted Publishing
        if: steps.resolve.outputs.tag != ''
        run: npm install -g npm@latest && npm --version

      - name: Download tarballs
        if: steps.resolve.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: dist

      # Authenticates with npm trusted publishing (OIDC). No --provenance flag:
      # npm adds provenance automatically once the repository is public, and
      # the flag fails while it is private.
      - name: Publish to npm
        if: steps.resolve.outputs.tag != ''
        env:
          TAG: "${{ steps.resolve.outputs.tag }}"
        run: |
          set -euo pipefail
          version="${TAG#v}"
          names="core interpreter javascript python perl ruby cli"
          for name in $names; do
            [ -f "dist/sandbox-workers-${name}-${version}.tgz" ] || { echo "::error::tarball for ${name}@${version} missing (versions and tag disagree)"; exit 1; }
          done
          for name in $names; do
            if npm view "@sandbox-workers/${name}@${version}" version >/dev/null 2>&1; then
              echo "@sandbox-workers/${name}@${version} already published; skipping"; continue
            fi
            # "./" is required: a bare "dist/<file>" is parsed as a GitHub owner/repo spec.
            npm publish "./dist/sandbox-workers-${name}-${version}.tgz" --access public
          done

      # On push, tagpr already created the Release. On dispatch, this run may
      # be the first attempt at publishing, so create it if missing.
      - name: Ensure GitHub Release exists
        if: steps.resolve.outputs.tag != '' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.resolve.outputs.tag }}"
        run: gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md"

      - name: Attach tarballs to the GitHub Release
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.resolve.outputs.tag }}"
        run: gh release upload "$TAG" dist/*.tgz --clobber

      # Re-pins templates/* to this release so the "Deploy to Cloudflare"
      # buttons always build from a tagged commit. The pinned commit can't
      # contain its own pin, so it necessarily lands as a follow-up commit
      # here. That commit is pushed with GITHUB_TOKEN, which does not trigger
      # other workflows, so this cannot loop; it rides into the next tagpr
      # release PR as an ordinary chore commit. Does not run
      # `pnpm test:templates` (4 full engine builds, >10 minutes) — run it
      # manually to verify a pin end to end.
      - name: Pin the deploy templates to this release
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.resolve.outputs.tag }}"
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ "$TAG" != "$latest" ]; then
            echo "::notice::$TAG is not the newest release ($latest); leaving the deploy templates as they are"
            exit 0
          fi

          node scripts/pin-templates.mjs "$TAG"

          if [ -z "$(git status --porcelain -- scripts/template-pin.json templates)" ]; then
            echo "templates already pinned to $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/template-pin.json templates
          git commit -m "Pin the deploy templates to $TAG"

          push() {
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          }
          if ! push; then
            echo "::notice::push rejected, retrying after rebasing onto origin/main"
            git pull --rebase origin main
            if ! push; then
              echo "::warning::could not push the template pin for $TAG; run 'pnpm templates:pin $TAG' manually and push the result"
              exit 0
            fi
          fi
